[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schoolmessenger-mcp"
version = "0.1.0"
description = "Absence-only MCP server for SchoolMessenger SafeArrival"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0,<2",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
schoolmessenger-mcp = "schoolmessenger_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["schoolmessenger_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
